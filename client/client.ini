[server]
; IP address of the server
ip=192.168.56.1

; API port (default: 5000)
api_port=5000

; File download port (default: 5001)
download_port=5001

; File upload port (default: 5002)
upload_port=5002

; Auto-approve tool requests (default: false)
skip_permissions=false

[remote]
; ClaudeWin9x-Remote only: connect as soon as it starts (default: false)
auto_connect=false

; ClaudeWin9x-Remote only: start with "Allow anything" on, so remote
; commands and file writes are not prompted for (default: false)
allow_all=false
